<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchitectGenesis</title>
    <meta
      name="description"
      content="ArchitectGenesis is an AI-powered civilization simulation where every Architect creates permanent history. Observe a living world. Enter the portal. Shape what happens next."
    />
    <link rel="icon" href="/favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-view="home">
    <canvas id="world-canvas" aria-hidden="true"></canvas>
    <div class="world-fallback" id="world-fallback" hidden></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar" id="topbar">
      <a class="brand" href="#/" aria-label="ArchitectGenesis home">
        <img src="/brand/logo.jpg" alt="" width="52" height="52" />
        <span>
          <strong>ArchitectGenesis</strong>
          <em class="motto">Every civilization begins with a single year.</em>
        </span>
      </a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="nav" aria-label="Primary">
        <a href="#/gameplay">Gameplay</a>
        <a href="#/features">Features</a>
        <a href="#/pricing">Pricing</a>
        <a href="#/about">About</a>
        <a href="#/faq">FAQ</a>
        <a href="#/community">Community</a>
        <a href="#/support">Support</a>
        <!-- Login link restore point: re-enable when authentication returns. -->
      </nav>

      <!-- Audio dock restore point: re-enable this block when audio returns. -->
      <div class="audio-dock" id="audio-dock" hidden>
        <div class="audio-trigger">
          <button type="button" id="btn-mute" class="icon-btn" aria-label="Unmute">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" />
            </svg>
          </button>
          <span class="audio-caption">Click for sound</span>
        </div>
        <div class="audio-sliders" id="audio-sliders">
          <label>Volume <input id="vol-master" type="range" min="0" max="1" step="0.01" value="1" /></label>
        </div>
      </div>
    </header>

    <section class="home-chrome" id="home-chrome">
      <aside class="social-rail" aria-label="Social">
        <a href="https://x.com/ArchitectGen" target="_blank" rel="noopener" data-network="x" title="X">X</a>
        <a href="https://www.instagram.com/architectgenesis/" target="_blank" rel="noopener" data-network="instagram" title="Instagram">IG</a>
        <a href="https://www.facebook.com/architectgenesis" target="_blank" rel="noopener" data-network="facebook" title="Facebook">f</a>
        <a href="https://www.tiktok.com/@ArchitectGen" target="_blank" rel="noopener" data-network="tiktok" title="TikTok">TT</a>
        <a href="https://discord.gg/JHfm7HY9y" target="_blank" rel="noopener" data-network="discord" title="Discord">Dc</a>
      </aside>

      <form
        class="signup"
        id="signup-form"
        data-type="subscription"
        action="https://f11b211f.sibforms.com/v2/serve/MUIFACOlL_0kErBdTWmbFGtCNE7zkBH4M9hARv5cOdHKSe1K4jGXyy3Dp1aOmhqY_qBwVZLtzu_LXR--OuQeZ5Zrq5KBhEr3z85p3MJpAdrNZU5BdYUtKjY_6VQ9DI7idqHOqGX4prt5vB-RVmF6G0ImypmUTYkAbrKkmMqFWItYL3_6lwT-3OHDwI5OajIfVUvrdFL66xc9aeEIZg=="
        method="post"
        target="brevo-submit-frame"
        autocomplete="on"
      >
        <p>Stay Updated</p>
        <label class="sr-only" for="signup-email">Email</label>
        <div class="signup-row">
          <input id="signup-email" name="EMAIL" type="email" required placeholder="Email" autocomplete="email" />
          <button type="submit">Join</button>
        </div>
        <small>Launch news and exclusive previews.</small>
        <p class="signup-msg" id="signup-msg" hidden></p>
        <input type="hidden" name="email_address_check" value="" />
        <input type="hidden" name="locale" value="en" />
      </form>
      <iframe name="brevo-submit-frame" title="Brevo submission response" class="brevo-submit-frame"></iframe>

      <div class="civ-board" id="civ-board">
        <p class="civ-era" id="civ-era">Prehistory</p>
        <h1 id="civ-name">The First Hearth</h1>
        <p class="civ-year" id="civ-year">12,000 BC</p>
        <p class="civ-slogan" id="civ-slogan">Before cities, there was fire.</p>

        <div class="carousel" id="carousel">
          <button type="button" class="icon-btn" id="civ-prev" aria-label="Previous civilization">‹</button>
          <div class="carousel-dots" id="carousel-dots" role="tablist" aria-label="Civilizations"></div>
          <button type="button" class="icon-btn" id="civ-next" aria-label="Next civilization">›</button>
        </div>

      </div>
    </section>

    <figure class="qr-plaque" id="qr-plaque">
      <canvas id="qr-canvas" width="128" height="128" aria-hidden="true"></canvas>
      <figcaption>
        <strong>Apple</strong>
        <span>App Store</span>
      </figcaption>
    </figure>

    <main id="page-root" class="page-root" hidden></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
